name: Content Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check repository for game content, keys, or generated game code
        run: python tools/check_content.py
